name: Verify and publish NARestraints
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: narestraints-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify the v1.1.4 workbook and its audit
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path

          expected = "baa41d80189f16e337cbd294ce91322eb40b68b144222c2d0cf696cb63a4607c"
          audit = json.loads(Path("docs/workbook-audit-2026-11-26.json").read_text())
          actual = sha256(Path("restraints/data/Ligands.xlsx").read_bytes()).hexdigest()
          if actual != expected or audit["after_sha256"] != expected:
              raise SystemExit("Workbook or audit differs from the reviewed v1.1.4 fingerprint")
          PY
      - name: Build and test both installed distributions
        shell: bash
        run: bash scripts/verify_release.sh
      - name: Test source-only NASolve modified-pair matrix stager
        shell: bash
        run: |
          python -m pip install ".[test]"
          python -m pytest -q tests/test_nasolve_pair_matrix_pipeline.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.python == '3.12'
        with:
          name: narestraints-dist
          path: dist/
          if-no-files-found: error
  publish:
    needs: verify
    if: github.repository == 'vecchioni-lab/NARestraints' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: narestraints-dist
          path: dist
      - name: Publish tested v1.1.4 artifacts without replacing a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'version = "1.1.4"' pyproject.toml
          (cd dist && sha256sum -c SHA256SUMS)
          if gh release view v1.1.4 >/dev/null 2>&1; then
            echo 'v1.1.4 already exists; refusing to overwrite it.'
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/v1.1.4" >/dev/null 2>&1; then
            echo 'v1.1.4 tag already exists; refusing to retarget it.'
            exit 1
          fi
          gh release create v1.1.4 dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title 'NARestraints v1.1.4 — reviewed nucleotide attachment mappings' \
            --notes-file docs/release-v1.1.4.md --draft
          gh release edit v1.1.4 --draft=false --latest
